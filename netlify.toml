# Netlify configuration for SpellStar
# Static Next.js export (output: 'export') is served from the `out/` directory,
# with one serverless function (vision-ocr) proxying Google Vision so the
# owner's API key stays a private env var and never ships to the browser.

[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  # Node version for the build + functions runtime
  NODE_VERSION = "20"

# Owner's Google Vision key is set in the Netlify dashboard (NOT here):
#   Site settings -> Environment variables -> GOOGLE_VISION_KEY
# It is read only inside netlify/functions/vision-ocr.ts at runtime.

[functions]
  node_bundler = "esbuild"

# next export emits real .html per route, so deep links resolve directly.
# This SPA-style fallback only catches anything not pre-rendered.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
